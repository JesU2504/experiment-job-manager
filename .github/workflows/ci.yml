name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: experiments_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runner -d experiments_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EJM_TEST_DATABASE_URL: postgresql+psycopg://runner:ci-only-password@127.0.0.1:5432/experiments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      EJM_API_KEY: ci-only-api-key-with-at-least-32-characters
      EJM_DB_PASSWORD: ci-only-compose-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
